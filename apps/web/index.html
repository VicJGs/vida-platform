<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vida Platform</title>
    <!-- fe-codec S2: preload ONLY the Editorial default body face (Spectral 400) — the cold-start preset. The other
         weights + the reader/quietDesk faces load via @font-face font-display:swap when needed (preset activation = S3).
         Keeps the initial font payload a small slice of the <80KB bundle budget (quality-bar _index.md:58). -->
    <link rel="preload" href="/fonts/spectral-400.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <!-- UI-4 · S1: process shim. @vida/ui runs Tamagui UNTAMED (no @tamagui/vite-plugin, the DS-4 decision), and
         @tamagui/core reads process.env.TAMAGUI_* at runtime; `process` is undefined in the browser → a
         ReferenceError crashes React to a blank page (jsdom defines process, so only a real browser surfaces it).
         A runtime shim covers EVERY process.env.* read across the library. Mirrors the Storybook preview-head.html
         fix (docs/specs/fixes/ui-1-storybook-slow-load). [[measure-browser-bugs-dont-hypothesize]] -->
    <script>
      window.process = window.process || { env: { NODE_ENV: 'development' } }
    </script>
    <!-- preferences-rescope R3 (B6): paint the PERSISTED theme's canvas before React, so a reload never flashes the default
         (IR-4). The hint is a device-local mirror written only from confirmed DB rows (src/preferences/theme-hint.ts); the
         app never reads it. Anything invalid paints nothing (the browser default, as before). Tested verbatim by
         src/index-hint-script.test.ts. -->
    <script id="vida-theme-hint">
      try {
        var h = JSON.parse(localStorage.getItem('vida.theme-hint.v1') || 'null')
        var hex = /^#[0-9a-f]{6}$/i
        if (h && typeof h.bg === 'string' && typeof h.fg === 'string' && hex.test(h.bg) && hex.test(h.fg) &&
            (h.scheme === 'light' || h.scheme === 'dark')) {
          var s = document.documentElement.style
          s.backgroundColor = h.bg
          s.color = h.fg
          s.colorScheme = h.scheme
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
