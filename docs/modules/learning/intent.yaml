# ED-31 (Victor, 2026-11-11, PR #305 review): the HC-36 model. Homework and assessments follow the hierarchy the
# syllabus and the program's setup define, never hanging free of their parent, and link to Knowledge because the user
# studies for them. assessments.subject_id is required today; modules and topics don't exist yet (ED-17).
- id: ED-31
  says: Education builds on other modules' entities instead of copying them; a class and a study block are sessions, a term is a dated container, and an assessment and homework are tasks of an Education type extended with Education's fields, each anchored in the hierarchy the syllabus and the program's setup define (its subject and the module or topic it covers) and linked to the Knowledge entities the user studies for it; being tasks gives them a due date and completion, and Education adds what tasks lack, such as preparation (ED-37).
  uses: [sessions, SS-1, tasks, TK-2, TK-21, knowledge, KN-6, KN-28, spaces, RT-31, ED-17, ED-37]
  open: Task and session types don't exist as user or module types yet; the Spaces run settles them first (RT-31), then this row and LIF-555 are revisited.
  work: LIF-555
# ED-32: SB-Q2, each module registers its own handlers when composed. Education owns no effect handler (it only emits).
- id: ED-32
  says: When the root composes Education, it passes its deps (sessions, the session registry, spaces, notes, tasks, books, knowledge, effects) and Education registers its class sub_type, its journal contribution, its measurement sources and its read provider; nothing is wired centrally.
  uses: [sessions, spaces, notes, tasks, books, knowledge, effects, journals, views, ED-26, ED-28, ED-33]
  work: LIF-450
- id: ED-33
  says: Education registers a read provider on the shared view registry, so the Tasks aggregator and any view resolve a subject; Tasks' course parent and Education's subject meet in one key.
  uses: [views, tasks, TK-2, TK-9]
  work: LIF-552
# ED-34: BR-LE-S7-6 leaves the scale mapping undefined; BR-LE-S7-5 rolls up equal-weight (no credit hours). ADR-011 M4.
- id: ED-34
  says: A subject's grade reads on its system's scale (letter, 0-10, pass or fail, or the user's own), and the term and curriculum averages weight each subject by its credits through the engine's weighted rollup.
  uses: [measurement, ED-7]
  open: Where credits live (the subject, or the curriculum's link to it).
  work: LIF-553
# ED-35: no setter writes the override (BR-LE-S8-4), so manual reads null; derivation ignores the kind (BR-LE-S8-2).
- id: ED-35
  says: The user sets a manually measured subject's or program's progress, and a subject measured by deliverables, a goal or a count derives through the engine by its kind, so a subject with no grading system still measures.
  uses: [measurement, ED-10]
  work: LIF-553
# ED-36: split from ED-5 (the second owner). ADR-014 X11, ADR-015 AI1, AI3, AI5, AI6.
- id: ED-36
  says: Document extraction (a syllabus to the schedule and assessments) is an opt-in scoped extract whose model call runs on the device or in the cloud as egress, bounds the untrusted document's provenance, marks its rows source ai, and is never an agent.
  uses: [ai, integrations, ED-5, ED-8]
  work: LIF-147

# ED-37 (Victor, 2026-11-11, PR #305 review): not new, spread across the docs. Sessions generates and owns the
# sessions (G2, SS-7; purposes exam_prep, pre_class, post_class, SS-2; generatePlan over a scope and a window); the
# Education compound set structures the Knowledge to prepare from (KN-2, KN-11). The effective setting resolves like
# the nearest grading system (BR-LE-S7-3).
- id: ED-37
  says: The user prepares inside Learning following the hierarchy; preparation (study sessions they schedule, reminders, and sessions scheduled automatically over a timeframe before a due or meeting date) is set on a program and passed down to its courses, classes, assessments, homework and the Knowledge structure tied to them, and any entity below can override it; each session targets the item and the subject, module, topic and Knowledge entities it covers.
  uses: [sessions, SS-2, SS-7, notifications, knowledge, KN-2, KN-11, ED-21, ED-22, ED-31]
  open: Which settings a preparation carries (timeframe, session count, purpose and length, reminder lead), and how auto-scheduling meets the engine's placement pass (LIF-442).
  work: LIF-557

