# Learning intent ledger: every intended, deferred or TBD Learning rule, keyed by its docs/features/learning ID.
# Learning is one sub-context today, Education (ED, LIF-426); Books, Knowledge, Skills and Sessions left it as their
# own modules (docs/features/learning/README.md). work = the issue that builds the rest. check:rules derives each
# row's state.
# Education's backend is built: mod-learning-education S1-S10 (6fa23297…37c372da, LIF-130) over migration 024 and
# schema/learning.ts (group #12, 15 tables, 327b535f). The feature docs' "3 tables", "0 lines", "no service" and
# "⚠ INTENDED (no schema)" lines are stale; the code is the truth. fe-learning-education (LIF-190) has no commits.
# Proof cites docs/modules/learning-education/current-business-rules.md (BR-LE-S1-1…S10-6) and, for the schema,
# docs/infrastructure/database-layer/current-business-rules.md (BR-ED-1…10).
# Tests: services/learning-education/__tests__/service.test.ts. Test names carry ED-2 (two it() titles) and, in
# describe() titles, ED-6, ED-7, ED-8, ED-10 and ED-11; ED-3, ED-4, ED-5, ED-12, ED-13 and ED-16 sit only in comments,
# which prove nothing. No test name holds a BR-LE ID (they're all in comments), so every other built row reads intent
# only. The database layer states unsliced BR-ED-1…10, so ED-n would match inside one in a scoped test name; none
# names one today (latent, the LIF-505 item 1 pattern). No bare BR-n, BR-Sn-n or zero-padded ED-0n in the tests.
# Measurement: grades, the grade average and progress are Education's, derived through the engine's normalize and
# rollup (BR-LE-S7-4, S7-5, S8-6); Purposes and Gamification read them live and never copy (ED-28).
# Base entities (Victor, 2026-11-11, HC-36): a class is a session (built), a study block is a session (ED-21), an
# assessment and homework are tasks of an Education type linked to their subject and to Knowledge entities (ED-31,
# LIF-555). Types wait for the Spaces run (RT-31). Datasets: ED-30.

# Invariants (docs/features/learning/education/business-rules.md)
# ED-1: the schema marks the [E] fields (schema/learning.ts); every repository passes them through at M1.0
# (BR-LE-S1-7). The inline subject tags ED-1 names are retired (BR-ED-1).
- id: ED-1
  says: Education's names and free text (a subject's title, description, provider, instructor, url and metadata; a feed's url, name and last error; a synced event's summary, description, location and raw event; every hierarchy, grading, assessment and vault name or description) are encrypted client-side; enums, dates, scores, progress and counters stay plaintext.
  uses: [encryption]
  proof: [BR-LE-S1-7]
  work: LIF-67
# ED-2: course_type stays as a nullable subject modality (BR-LE-S2-3), and the formal or self-taught mode lives on the
# program's parent. The identity's "not a certification authority" folds here: the OS records, it never credentials.
- id: ED-2
  says: Every program parents to an institution or a self-taught path, two separate tables, and must resolve on create; below the program, formal and self-taught study are structurally identical, and Vida records study without ever credentialing it.
  proof: [BR-LE-S1-1, BR-LE-S1-2, BR-ED-6]
# ED-3: reconciled at S2 (BR-LE-S2-1): an empty routing is allowed (A1, ED-14); a given ref must resolve. The degree
# tier is a field on the subject (BR-ED-6).
- id: ED-3
  says: A subject routes up its chain (curriculum, an optional term, a degree tier); a given curriculum or term must resolve to a live, consistent chain or the create is a typed UnroutedSubjectError, skipped levels collapse, and a subject with no routing yet is allowed and organized later.
  proof: [BR-LE-S1-5, BR-LE-S2-1, BR-ED-6]
- id: ED-4
  says: A class is a session of a subject, the class sub_type with its one-to-one extension, the base session owning time and lifecycle; assessments, grades, documents, homework and notes attach to the subject, never to a meeting, and a retake is a new subject in a new term.
  uses: [sessions, SS-1]
  proof: [BR-LE-S4-1, BR-LE-S4-2, BR-LE-S4-4, BR-LE-S4-5, BR-ED-7]
# ED-5 is split (two owners): the single schedule and its source are Education's; document extraction is ED-36
# (LIF-147), and the weekly pattern that generates class sessions is Sessions' planned blocks (ED-23, LIF-442).
- id: ED-5
  says: Each subject has one schedule, fed by exactly one of three sources (calendar feed sync, document extraction or manual shaping); the meetings and the weekly view derive from it and never read a feed directly.
  uses: [sessions, integrations, ED-23, ED-36]
  proof: [BR-LE-S4-3, BR-LE-S4-7]
  work: LIF-442
# ED-6: the add-only feed is built (S5). Live fetch is deny-safe (IcsUnavailableError) until the Integrations feature
# brings it (LIF-147); the localhost product has no server, so the fetch is the device's. auto_create_sessions is
# stored but spawns no class session at M1 (BR-LE-S5-2, S5-6). Folded here: an unmatched event surfaces for manual
# match (BR-LE-S5-7), and an ingest needing server plaintext is refused.
- id: ED-6
  says: A calendar feed fetches on the device every sync interval as a user-added source under its external grant; events dedup by feed and uid and are ignored rather than deleted, unmatched events wait for a manual match, a failed fetch is kept in last error and never leaves a silently stale schedule, revoking a feed stops future fetches and keeps synced events, and the server never sees feed plaintext.
  uses: [integrations, sessions, ED-4]
  proof: [BR-LE-S5-1, BR-LE-S5-3, BR-LE-S5-4, BR-LE-S5-5, BR-LE-S5-6, BR-LE-S5-7, BR-ED-4]
  open: Whether a revoked feed is skipped by the sync loop (the S5 forward note), and how a matched event becomes a class session.
  work: LIF-147
# ED-7: the builder, the weight rule, nearest-scope resolution and the derived grade are built (S6, S7). The scale
# label and credit weights are ED-34 (LIF-553). Folded here: components summing to other than 100% are flagged, never
# normalized (BR-LE-S6-2); a failed compute returns a flagged partial, never a wrong number (BR-LE-S7-8).
- id: ED-7
  says: A grading system (per institution, program or subject override) defines weighted components and a scale; a subject's grade and any term or curriculum average derive from assessments through the nearest system, components that don't sum to 100% are flagged and never normalized, and a partial result is flagged, never hand-set or fabricated.
  uses: [measurement, ED-34]
  proof: [BR-LE-S6-1, BR-LE-S6-2, BR-LE-S7-3, BR-LE-S7-4, BR-LE-S7-5, BR-LE-S7-8, BR-ED-8]
  work: LIF-553
# ED-8: built as a standalone table (S7). Under the base-entity model an assessment occurrence is a typed task with
# this row as its extension (ED-31, LIF-555). Auto-record from a feed or a document is ED-6 / ED-36.
- id: ED-8
  says: An assessment (exam, quiz, test, presentation or work) sits in the Learning hierarchy where the syllabus and the program's setup place it, under its subject and the module or topic it covers, never free of its parent; it carries its date, weight or points, modality and score, recording a result writes the score only and the grade re-derives, and rows auto-recorded from extraction carry source ai.
  uses: [tasks, ED-17, ED-31, ED-37, ai]
  proof: [BR-LE-S7-1, BR-LE-S7-2, BR-LE-S7-7]
  work: LIF-555
# ED-9: Education's read is deny-safe (BR-LE-S10-1); Tasks implements no listForEducation yet, which LIF-471's
# "Learning gets the same read by its parent link" covers. Tasks keys the parent as course_id (TK-2).
- id: ED-9
  says: Homework is a task owned by Tasks that sits in the Learning hierarchy where the syllabus and the program's setup place it, under its subject and the module or topic it covers, never free of its parent, and Education reads it through the Tasks-to-Education read; Education never keeps a homework table or reads the tasks table.
  uses: [tasks, TK-2, TK-9, TK-13, ED-17, ED-31, ED-37]
  proof: [BR-LE-S10-1, BR-ED-10]
  work: LIF-471
# ED-10: built (S8). Manual progress and per-kind derivation are ED-35 (LIF-553).
- id: ED-10
  says: Subject and program progress lives in an Education-only measure, its kind and binding mode on the Projects axes but separate storage, a nullable override that derives on read (a subject from its grade, a program by rolling up its subjects), and unmeasured reads null, never zero.
  uses: [measurement, projects, ED-35]
  proof: [BR-LE-S8-1, BR-LE-S8-2, BR-LE-S8-3, BR-LE-S8-4, BR-LE-S8-5, BR-LE-S8-6, BR-LE-S8-8, BR-ED-2, BR-ED-3]
  work: LIF-553
# ED-11: the fork is built (S3). A program's default curriculum as a shipped base is the dataset row ED-30.
# TemplateImmutableError is exported, never thrown: the base is untouched by construction (BR-LE-S3-2b).
- id: ED-11
  says: A curriculum is user-shaped and forkable; a fork deep-copies the live terms and subjects into a new tree with a lineage pointer, remaps their refs and resets progress, never writes the base, and deleting a fork leaves the base.
  uses: [ED-30]
  proof: [BR-LE-S3-1, BR-LE-S3-2, BR-LE-S3-2b, BR-LE-S3-3, BR-LE-S3-4, BR-LE-S3-5, BR-LE-S3-6, BR-LE-S3-8, BR-LE-S3-9]
- id: ED-12
  says: Terms are hierarchical time containers (year, semester, term) with an optional parent that must resolve when given, and they're optional.
  proof: [BR-LE-S1-3]
# ED-13: built (S9). The real attachment pipeline is a deny-safe port; with none, the file goes inline, raw at M1
# (encryption is ED-1, LIF-67).
- id: ED-13
  says: Each subject has one vault holding its documents (inline when small, an attachment reference when large) and its notes together, and a write succeeds locally first.
  uses: [notes, sync]
  proof: [BR-LE-S9-1, BR-LE-S9-2, BR-LE-S9-3, BR-ED-9]
- id: ED-14
  says: From subject down to topic, Education's data is progressively fillable; pages render partial data gracefully and invite increments, and empty is never an error.
  uses: [views, ED-17]
  proof: [BR-LE-S2-1]
  work: LIF-190
- id: ED-15
  says: Every personalizable Education view ships a sensible default so the user isn't lost personalizing instead of studying.
  uses: [views]
  work: LIF-190
- id: ED-16
  says: Every Education write succeeds locally first, and Education tags its programs, curricula and subjects through the shared entity tags, never an inline tags column.
  uses: [spaces, sync]
  proof: [BR-LE-S9-4, BR-LE-S9-5, BR-ED-1]

