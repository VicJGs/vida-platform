  uses: [integrations, templates, HT-1, HT-12]
  work: LIF-549
- id: HT-16
  says: Training's surfaces show their terminal states (an empty catalog, a plan in draft, active, deload week or completed, a workout scheduled, in progress, paused, completed, skipped or modified, a set planned, logged or failed, a failed generation falling back to manual).
  uses: [views]
  work: LIF-183
# Consumers with no row here. Built and in their own ledgers: the sensitive-module consent (SS-5; Health is in
# SENSITIVE_MODULE_CLASSES), the one-sub_type rule (SS-1), Routines' step reference (RT-3; its exercise step maps to the
# unregistered workout sub_type, HT-14). In their own ledgers, not built: Purposes' derived-pull reads (PG-15, MS-9,
# LIF-516), Check-ins' sources (CK-19), the any-entity rule (GM-36) and capability consent for a Health write (GM-6),
# Knowledge's links and compound sets (KN-6, KN-11), Focus Mode tools (PD-13), the journal blocks (JR-12, JR-20).
# Designed only: Notifications' Health reminders, deload alerts and safety flags (HC-15, HC-27, HT-6), Skills' role and
# cooking bindings (HC-9, HN-14, the skills run), Knowledge's technique links (exercises.knowledge_object_id,
# physical_roles.knowledge_subject_id) and protocol kind (HC-12), Finance's costs (HN-7), wearables (HC-22, LIF-144).
# The README's Duties and Obligations stub has no module in LIF-426; its due items are HC-27. Every Health entity is a
# potential Gamification rule subject (GM-36, HC-28); no module is ruled out.
