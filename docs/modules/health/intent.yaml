# Health intent ledger: every intended, deferred or TBD Health rule, keyed by its docs/features/health ID: Core (HC,
# the shared spine), Nutrition (HN) and Training (HT), the two pillars (LIF-426: one ledger, three prefixes). work =
# the issue that builds the rest. check:rules derives each row's state.
# Health has no service and no web code. What's built is the schema only: migrations 027-029 and
# schema/health-core.ts, health-nutrition.ts, health-training.ts (2d270150, 2adb3eb4, 7d8390ba; 7a2a2a44 unified the
# authoring provenance). No path under services/health has ever existed in git. A built table with no service isn't a
# built behavior, so a schema-backed row cites its database-layer rule as proof and keeps its work link (Victor,
# 2026-11-11): it reads intent only today and at most partly tested later. Proof cites
# docs/infrastructure/database-layer/current-business-rules.md: BR-HC-1…8 (Core), BR-NT-1…6 (Nutrition, not BR-HN)
# and BR-HT-1…6 (Training).
# Tests: the three DDL-introspection tests (db/tests/health-*-introspection.test.ts) are the only Health tests, and they
# name no rule ID, so every row reads intent only. No test anywhere names an HC, HN or HT ID, padded or not. The
# database layer states unsliced BR-HC-n and BR-HT-n, so HC-n and HT-n would match inside one in a scoped test name;
# none names one today (latent, LIF-349 run 26 findings).
# Measurement: Health advertises its measures as sources and stores no copy of another module's data (HC-5, HC-28).
# Datasets: HC-33, HN-17, HT-15. Sessions: a workout is a session the user can name and type (HT-14); a meal and an
# exam are due items, not sessions (HN-2, HC-20).

# Invariants: Core (docs/features/health/core/business-rules.md)
- id: HC-1
  says: Every tracked attribute is one metric of kind body-measure, performance-capacity, test-result or biomarker, with a unit, a direction (higher or lower is better), a category and an optional side (left, right or bilateral); the biomarker kind ships an editable starter clinical panel, and there are no separate body, performance or test systems.
  uses: [knowledge]
  proof: [BR-HC-1, BR-HC-5, BR-HC-7]
  work: LIF-126
- id: HC-2
  says: A metric value enters by direct measure, derived computation, a test protocol or an exam result, and carries its provenance source (manual, photo, wearable, derived, exam, import or a model) with an optional photo and life-context; the source is the value's provenance, distinct from a goal's binding mode, and wearable or import values arrive only through device-mediated ingestion under the user's grant.
  uses: [measurement, integrations, ai]
  proof: [BR-HC-6]
  work: LIF-126
# HC-3's columns are built (the decomposed goal and the nullable progress slot); progress() is not.
- id: HC-3
  says: Health has one goal system, and the goal is the pursuable; it carries a measurement kind and a binding mode in place of a goal type, and its progress is a nullable override that derives on read from its target metrics or role mastery over a short, medium or long horizon, never hand-typed for a measurable goal.
  uses: [measurement, purposes]
  proof: [BR-HC-3, BR-HC-4]
  work: LIF-126
- id: HC-4
  says: A goal drives programming; in the Core the user builds the training and nutrition plans by hand toward the goal, and model generation or library and prescription import are opt-in layers whose rows carry their source.
  uses: [ai, integrations, HN-6, HT-9]
  work: LIF-126
# HC-5: no source is advertised; the registry shape is MS-9 (LIF-516). Purposes reads, never copies.
- id: HC-5
  says: Body-metric series and goal progress are measurement sources (body weight, body fat, one-rep max per lift); Purposes and derived-pull goals read them through the measurement read seam, never a table read, and an outage keeps the last-known value with a flag.
  uses: [measurement, MS-9, purposes, PG-15]
  work: LIF-126
# HC-6's burn column is built (workout_sessions.calories_burned, burn_source); the loop is not.
- id: HC-6
  says: The energy loop is closed and dynamic; calories burned come from the user's chosen method (a formula from duration, intensity and body weight by default, a wearable, or manual entry), the nutrition intake target recomputes against each day's burn, volume is sets times reps times weight, cardio is duration times intensity, and calories are protein and carbs at 4 and fat at 9 per gram.
  uses: [HN-3, HT-5]
  proof: [BR-HT-3]
  work: LIF-126
# HC-7: a generic N-of-1 framework is a candidate ADR in the Health README.
- id: HC-7
  says: An experiment states a hypothesis, defines a control arm and a test arm, runs for a duration, is measured through Health metrics and subjective responses, and resolves to a winner and a key learning; hypotheses come from the user, community claims or a doctor's prescription.
  proof: [BR-HC-1, BR-HC-7]
  work: LIF-126
- id: HC-8
  says: Responses and resolved experiments accumulate into a derived response profile (how this body responds to a training type, a food or a timing), computed on read and never a base table, which a planning model may take as context.
  uses: [ai]
  work: LIF-126
- id: HC-9
  says: A physical role is the trainable-capability unit (calisthenics, swimming, a martial art, triathlon); it owns objectives, a can-do definition and a mastery that derives as a weighted rollup over its linked exercises and goals, generates or links the exercises that build it, binds a Knowledge subject and a Skill, reads the medical profile to exclude or adjust exercises, and is authored by hand or by opt-in model or curated import.
  uses: [measurement, knowledge, skills, purposes, HC-16]
  proof: [BR-HC-4, BR-HC-5]
  work: LIF-126
# HC-10's [E] set is marked in the schema and dormant: Health has no repository at all (LIF-67).
- id: HC-10
  says: All Health data is encrypted (most fields), and every external or model path (wearable sync, food database, barcode, photo analysis, plan or meal generation, prescription import) is opt-in, on-device-preferred and at the user's own risk, never a precondition of the manual Core.
  uses: [encryption, integrations, ai]
  proof: [BR-HC-7]
  work: LIF-67
- id: HC-11
  says: Weights, lengths and energy are stored canonical (kg, cm, kcal) and shown in the units the user picks in Preferences.
  uses: [preferences]
  work: LIF-126
# HC-12: Knowledge ships no protocol kind (topic, concept, definition only); metrics hold protocol_id.
- id: HC-12
  says: Testing and recovery protocols are Knowledge objects of a protocol kind, referenced by id, never Health tables.
  uses: [knowledge]
  work: LIF-126
- id: HC-13
  says: Health composes Sessions, Knowledge, Notes and Pages, Spaces and Preferences and never rebuilds sessions, scheduling, tags, views or notes.
  uses: [sessions, knowledge, notes, spaces, preferences]
  proof: [BR-HC-8, BR-HT-5]
  work: LIF-126
- id: HC-19
  says: Health Domains contain Health Factors, a user-extensible monitoring hierarchy with a shipped starter set that groups metrics; a factor result is a metric value, never a separate store.
  proof: [BR-HC-1]
  work: LIF-126
- id: HC-20
  says: An exam (a blood panel, a checkup, imaging) is set up by the user with a schedule and reminders; each occurrence is a due item on the agenda, not a session, moves through scheduled, due, overdue, logged or skipped, and its results come back as metric values with the exam as their source.
  uses: [sessions, notifications, HC-27]
  proof: [BR-HC-1, BR-HC-7]
  work: LIF-126
- id: HC-21
  says: Derived metrics (basal metabolic rate, energy expenditure, lean mass, fat mass, one-rep max) are computed on the device from other metric values by a formula declared on the metric, never by a model or a server; a stored value is a cache and the source rows are the truth.
  work: LIF-126
# HC-22 is the Integrations feature. On today's localhost product there's no server, so input is device-mediated and
# output waits for per-service research (LIF-144, M2).
- id: HC-22
  says: External integrations are opt-in, bidirectional and intent-only for now; input from health platforms, wearables and open sources becomes metric values through device-mediated ingestion under the user's input grant, reconciled add-only, and output to medical systems is egress under the stricter guard (per-target consent, the union of consents, an audit, never sent automatically); neither is a precondition of the manual Core.
  uses: [integrations, HC-2]
  work: LIF-144
- id: HC-23
  says: Biomarker ranges inform and flag, never diagnose, prescribe or block; they are soft context under autonomy with clarity, and biomarker data is the most sensitive class.
  uses: [HC-14, HC-15, HC-17]
  work: LIF-126

# Invariants: Safety and Medical (docs/features/health/core/business-rules.md)
- id: HC-14
  says: The user has full sovereignty over their own body; Health records, advises and safety-nets, but never gatekeeps, prescribes, credentials or blocks, with a one-time explicit acknowledgment and the user always free to proceed.
  work: LIF-126
- id: HC-15
  says: Danger signals (overtraining, extreme or rapid weight change, an extreme caloric deficit, a concerning biomarker, an injury or pain pattern, a warning response) raise an advisory safety flag, surfaced in Health and as a notification, that says when medical attention is warranted; a flag is dismissible, logged and never blocking.
  uses: [notifications]
  proof: [BR-HC-1, BR-HC-7]
  work: LIF-126
- id: HC-16
  says: Health owns the medical profile (conditions, allergies, injuries, medications, supplements, prescriptions, clearances, contraindications) and exposes it to both pillars; injuries filter exercises, allergies filter foods, prescriptions inform targets, and every filter advises, so an excluded item is flagged with a reason, never removed.
  uses: [HN-11, HT-12]
  proof: [BR-HC-1, BR-HC-7]
  work: LIF-126
- id: HC-17
  says: Medical data is the most sensitive class; every medical field is encrypted, imported doctor input is opt-in and on-device-preferred, and Vida never sends medical data in plaintext.
  uses: [encryption, integrations]
  work: LIF-67
- id: HC-18
  says: A prescription from a doctor, the community or the user may spawn an experiment to validate it on the user's own body; imported prescription content is untrusted input whose provenance travels into any model prompt, the outgoing slice is user-reviewed, and injected tool calls can't widen the scope.
  uses: [HC-7, integrations, ai]
  work: LIF-126

# Invariants: Nutrition (docs/features/health/nutrition/business-rules.md)
- id: HN-1
  says: Ingredients hold atomic macros, a dish's macros are the sum of its ingredients, a meal's are the sum of its dishes, a day's total is the sum of its meals, and calories are protein and carbs at 4 and fat at 9 per gram; a dish never stores its macros as the truth.
  proof: [BR-NT-1]
  work: LIF-164
- id: HN-2
  says: A meal is a logged entity with a scheduled time and a status, never a session; a planned meal is a due item on the agenda.
  uses: [sessions, HC-27]
  proof: [BR-NT-5]
  work: LIF-164
- id: HN-3
  says: The nutritional plan derives a calorie and macro target from the user's Health goals and recomputes it against each day's burn (a training day means eating more); a stored target is a cache.
  uses: [HC-3, HC-6]
  work: LIF-164
- id: HN-4
  says: A nutrition goal phase (fat loss, muscle gain, recomposition, event prep) is a Core Health goal; Nutrition references it and owns no parallel goal system.
  uses: [HC-3]
  proof: [BR-NT-1, BR-NT-5]
  work: LIF-164
- id: HN-5
  says: Meal-timing, portion and food-choice tests and food responses are the Core adaptation engine's experiments and responses for the nutrition pillar.
  uses: [HC-7, HC-8]
  proof: [BR-NT-1]
  work: LIF-164
- id: HN-6
  says: A plan or a day's meal plan is built by hand, by an opt-in model call, or by import (a doctor's prescription included, then validated by an experiment), and the row carries its manual, model or import source; the manual path is always enough.
  uses: [ai, integrations, HC-18]
  proof: [BR-NT-3]
  work: LIF-164
# HN-7: Finance stores no Health copy (the run-22 model). Whether a purchase is the user's own Finance transaction or
# a cost Finance reads from Nutrition is open.
- id: HN-7
  says: Shopping items and meal costs, in integer cents, bridge to Finance's budget, and the shopping list derives from the day's or period's meal plan.
  uses: [finance]
  open: Whether a purchase becomes a transaction the user records in Finance, or Finance reads Nutrition's costs live; Finance keeps no copy either way.
  work: LIF-164
# HN-8: meals have no life_context column; only health_responses does (migration 028).
- id: HN-8
  says: Meals and responses carry a life-context (normal, training, rest, travel, social, sick), so intake and analysis are schedule- and travel-aware.
  work: LIF-164
- id: HN-9
  says: A meal may be logged by photo through an opt-in block whose photo-to-macros inference is a model call, on-device-preferred, with the photo's provenance carried into the prompt and the row tagged as model-sourced; the food database behind the libraries is a whole-set public-reference import under the user's input grant, and manual entry is always there when the photo fails.
  uses: [ai, integrations, capabilities, HN-17]
  work: LIF-164
- id: HN-10
  says: Logged meals, macros and calories consumed reach the journal and the Core energy loop, adherence and goal progress reach Gamification, and meal reminders reach Notifications.
  uses: [journals, HC-25, gamification, notifications, HC-27]
  work: LIF-164
- id: HN-11
  says: Allergies and intolerances from the medical profile filter foods and plans by their allergens, and conditions and prescriptions inform intake targets and the supplement protocol; filtering advises with a reason, never removes, and an imported prescription is a device-mediated ingest whose untrusted text carries provenance into any model prompt.
  uses: [HC-16, HC-18, integrations, ai]
  work: LIF-164
# HN-12's research (R2) may reshape the taxonomy; the starter ships with the datasets (HN-17).
- id: HN-12
  says: Ingredients and dishes carry a functional area (the eight body systems they serve, from digestive and gut to systemic resilience), so meals and plans can target a system; it is taggable, ships as an editable starter and is never hard-coded as truth.
  uses: [spaces, HN-17]
  proof: [BR-NT-3]
  work: LIF-164
- id: HN-13
  says: Ingredients carry a whole-food type (leafy greens, cruciferous, roots, bioactive fruits, nuts and seeds, legumes, whole grains, animal proteins, spices, functional beverages) for grouping and filtering, as an editable starter.
  uses: [HN-17]
  proof: [BR-NT-3]
  work: LIF-164
- id: HN-14
  says: A dish is documented data with an optional recipe page by default; only when the user turns on cooking tracking does a dish gain a learn-to-cook status as a Skill or Knowledge object.
  uses: [skills, knowledge, notes]
  proof: [BR-NT-5]
  work: LIF-164
- id: HN-15
  says: Every external, model and tag path is layered; the food database and barcode are a device-mediated public-reference whole-set import under the input grant, a fetch without the grant fails closed with a typed error, meal generation and photo analysis are scoped model calls that fall back to manual and never act as an agent, every model row is tagged as model-sourced, and every Nutrition entity tags through the universal tags, never an inline column.
  uses: [integrations, ai, spaces]
  proof: [BR-NT-4]
  work: LIF-164

# Invariants: Training (docs/features/health/training/business-rules.md)
- id: HT-1
  says: Training follows a five-layer spine, catalog then plan then template then instance then log; a plan references catalog exercises, a template composes them into a session shape, an instance is a performed session and the logs record the actual sets.
  proof: [BR-HT-1]
  work: LIF-165
# HT-2's extension table is built (session_id unique, no deleted_at); no workout sub_type is registered (HT-14).
- id: HT-2
  says: A performed workout is a Sessions workout sub_type with a Training-owned extension; Training never reimplements the session runtime or scheduler.
  uses: [sessions, SS-1, HT-14]
  proof: [BR-HT-1]
  work: LIF-165
- id: HT-3
  says: An exercise plan projects onto days through the scheduling engine, which the Global Calendar renders; Training never duplicates scheduling.
  uses: [sessions, HC-27]
  work: LIF-165
- id: HT-4
  says: Each assigned exercise records planned and actual sets, reps and weight, form quality and perceived exertion; volume is sets times reps times weight, and cardio is duration times intensity.
  proof: [BR-HT-4]
  work: LIF-165
- id: HT-5
  says: Records, one-rep max, max reps and volume become Core metric values (performance kind, derived source) per lift and per side, never Training-local figures.
  uses: [HC-1, HC-2]
  proof: [BR-HT-5]
  work: LIF-165
- id: HT-6
  says: A plan carries a progression model, a deload frequency and an energy-system focus, which govern how assigned load advances week to week toward its goals, and a coming deload can raise a reminder.
  uses: [notifications, HC-27]
  work: LIF-165
- id: HT-7
  says: Training focus, workout type, movement pattern and exercise category are properties on one spine, never a table per modality.
  proof: [BR-HT-3]
- id: HT-8
  says: A workout that serves a physical role uses that role's session sub_types (a class, sparring) and links its technique in Knowledge, generic strength work needs no role, and a role generates or links the exercises that build it.
  uses: [HC-9, sessions, knowledge, HT-13]
  work: LIF-165
- id: HT-9
  says: A plan or template is built by hand, by an opt-in model call or by library import, and carries its source; the manual path is always enough.
  uses: [ai, integrations, HC-4]
  proof: [BR-HT-3]
  work: LIF-165
- id: HT-10
  says: Testing and recovery protocols are Knowledge objects that a workout or a test references, never inlines.
  uses: [knowledge, HC-12]
  work: LIF-165
- id: HT-11
  says: Completed workouts reach the journal and Gamification (streaks and records), scheduled workouts reach the Calendar and agenda, and burn reaches the Core energy loop.
  uses: [journals, HC-25, gamification, sessions, HC-6]
  work: LIF-165
- id: HT-12
  says: Injuries and contraindications from the medical profile filter the exercise catalog and plans by each exercise's risk level, and overtraining signals raise a Core safety flag; an excluded exercise is flagged with a reason, never removed.
  uses: [HC-15, HC-16]
  work: LIF-165
- id: HT-13
  says: When a physical role generates its exercises or plan, it filters through the medical profile; the manual builder is the Core path, and model generation and curated role-library import are opt-in.
  uses: [HC-9, HC-16, ai, HT-15]
  work: LIF-165

# Proposed IDs, no ID in docs/features/health/core today (approve in the PR)
# HC-24: fe-health (LIF-183) names Core only; its pillar twins LIF-184 and LIF-185 are canceled, so it holds all three.
- id: HC-24
  says: Health's surfaces show every capability's terminal states (metric series, monitoring, exams, goals, roles, experiments, the profile, the medical profile, safety flags), and the Training, Nutrition and role surfaces are Spaces (tags and saved views), never a hand-built page per pillar.
  uses: [spaces, views]
  work: LIF-183
- id: HC-25
  says: Health contributes its day to the journal (workouts done, meals and macros, calories burned and consumed, metrics logged), read live through its contribution.
  uses: [journals, JR-11]
  work: LIF-112
- id: HC-26
  says: Health has its own journal blocks and capability blocks, a workout logger and a photo food logger among them; each reads Health live and writes only through Health's service, separate from its journal contribution.
  uses: [journals, JR-12, JR-20, capabilities, editor]
  work: LIF-183
- id: HC-27
  says: Health serves the due agenda; exam occurrences, planned meals and assigned workouts are due items keyed by their own entity, so they reach the Calendar and fire reminders that a Health push toggle gates.
  uses: [sessions, notifications, preferences, HC-20, HN-2, HT-3]
  work: LIF-126
- id: HC-28
  says: Every Health entity is a potential Gamification rule subject; Health exposes its events (a workout done, a record set, an exam logged, a flag raised) and its measures (streaks, adherence, goal progress) so a user's rule can reward or penalize them, including something that didn't happen.
  uses: [gamification, GM-36, measurement, MS-9, HC-5]
  work: LIF-126
- id: HC-29
  says: Health reads the user's subjective energy, mood and sleep from Check-ins live (Health owns the objective measures) and keeps no copy.
  uses: [check-ins, CK-19, measurement]
  work: LIF-126
- id: HC-30
  says: Health's entity types register in the open taggable-type registry, so tags, links and pages reach every metric, goal, role, experiment, exam, medical entry, flag, food, meal, plan, exercise and workout; Health owns no tag table.
  uses: [spaces, notes]
  proof: [BR-HC-8, BR-NT-4, BR-HT-6]
- id: HC-31
  says: Health serves a read provider, so its entities show in views, search and links like any other module's.
  uses: [views]
  work: LIF-126
# HC-32: SB-Q2, each module registers its own handlers when composed. ADR-004 names the workout's effect (training
# volume); BR-HC-5 routes XP through the Sessions effect.
- id: HC-32
  says: When the root composes Health, Health registers its own session sub_types, its effect handlers, its measurement sources, its due lane, its journal contribution and its read provider; nothing is wired centrally.
  uses: [sessions, effects, measurement, journals, views, HT-14, HC-25, HC-27, HC-31]
  work: LIF-126
- id: HC-33
  says: The starter biomarker panel, the starter domains and factors, and the curated physical-role library ship as opt-in default datasets the user accepts or declines, refreshed as a whole set and read from a local copy; the pattern is built even when declined.
  uses: [integrations, HC-1, HC-9, HC-19]
  work: LIF-549
- id: HC-34
  says: The data model's record shows the Health tables migrations 027-029 built (twelve Core, six Nutrition, five Training, no foreign keys, deleted_at only where the floor marks it).
  proof: [BR-HC-1, BR-NT-1, BR-HT-1]
  work: LIF-63
- id: HC-35
  says: The Health module toggle and the dietary defaults are Preferences keys that Health reads.
  uses: [preferences]
  work: LIF-126

