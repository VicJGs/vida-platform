# Skills intent ledger: every intended, deferred or TBD Skills rule, keyed by its docs/features/skills ID (SK,
# LIF-426). work = the issue that builds the rest. check:rules derives each row's state.
# Skills has no service and no web code beyond a nav entry (/skills, no page). What's built is the schema only:
# migration 021 and schema/skills.ts, seven tables (74a4793a). No path under services/skills has ever existed in git,
# and mod-skills (LIF-140) and fe-skills (LIF-200) have no commits. A built table with no service isn't a built
# behavior, so a schema-backed row cites its database-layer rule as proof and keeps its work link (Victor, 2026-11-11,
# the Health precedent): it reads intent only today and at most partly tested later. Proof cites
# docs/infrastructure/database-layer/current-business-rules.md (BR-SK-1…7).
# Tests: the DDL-introspection test (db/tests/skills-introspection.test.ts) is the only Skills test, and its describe()
# and it() titles name no rule ID, so every row reads intent only. No test anywhere names an SK ID, padded or not; the
# only SK-n strings in code sit inside BR-SK-n in schema and migration comments. The database layer states unsliced
# BR-SK-1…7, so SK-n would match inside one in a scoped test name; none names one today (latent, the LIF-505 item 1
# pattern). No bare BR-n or BR-Sn-n in the Skills test. SK1…SK8 in the feature docs are the archived intake's gap
# codes, with no hyphen, so they can't match an SK row.
# Measurement: level, progress and mastery are Skills', derived on read (BR-SK-1); Purposes and Gamification read them
# live and never copy (SK-10, SK-21).
# Base entities and hierarchy (Victor, 2026-11-11): everything in a skill hangs from its hierarchy (skill, level,
# activity), and each activity creates its entity in the owning module, anchored to its level: practice is a session,
# study a Knowledge study session, project a Projects project, assessment a task of a Skills type, review the review
# engine (SK-6, SK-17). Preparation is set on the skill, passed down and overridable (SK-18, the ED-37 model). Skills
# runs no due lane (SK-19). Types wait for the Spaces run (RT-31). Datasets: SK-27.

# Invariants (docs/features/skills/business-rules.md)
# SK-1: the docs' six skill domains (Professional, Technical, Creative, Social, Mental, Physical) are stale; the
# schema reuses the life domains, and that is the intent (Victor, 2026-11-11).
- id: SK-1
  says: A skill is a goal-driven capability in exactly one life domain (health, career, finance, relationships, personal growth, spiritual, recreation, environment), with why it matters and the mastery and date it targets.
  proof: [BR-SK-6]
  work: LIF-140
- id: SK-2
  says: Each skill defines its own ladder as data, ordered levels with completion criteria and success indicators, never one universal scale; ladder templates (belts, ranks, milestones, language levels) seed a ladder.
  uses: [SK-27]
  proof: [BR-SK-6]
  work: LIF-140
# SK-3: the docs' fill source "llm" is built as "ai" (SKILL_FILL_SOURCE, provenance AI6). The community stays outside
# Vida: the only bridge is import and the user's own template export.
- id: SK-3
  says: A skill's definition, ladder and activities fill by hand, by an opt-in model call or by import from the curated skill library; definitions vary by locale (language, region, culture) and dedupe by name and locale, a miss falls back to manual, a model draft or a community template import, and Vida never submits to a community, the user's generic template export being the only bridge.
  uses: [integrations, ai, SK-14, SK-27]
  proof: [BR-SK-6]
  work: LIF-140
# SK-4: the stored current_level and progress are caches; the override is flagged (M3).
- id: SK-4
  says: Mastery derives on read from gates, activities, assessments, linked Knowledge mastery and practice consistency, and a manual override is flagged; an ability that can't be measured digitally is qualitative, self-rated or evidence-based, and Vida never fakes a number.
  uses: [measurement, knowledge, KN-30, SK-5]
  proof: [BR-SK-1]
  work: LIF-140
- id: SK-5
  says: The Skill Composer defines each skill, what it is, which modules it works with, what's tracked and how progress and mastery are measured (a measurement kind with derived-pull binding, referenced and never stored as a pursuable column), in a quick mode from a template or an advanced custom mode.
  uses: [measurement, MS-15]
  proof: [BR-SK-4]
  work: LIF-140
# SK-6: the activity types and what each creates are Victor's (2026-11-11). Skills references the created entity by
# id and never duplicates it.
- id: SK-6
  says: An activity's type sends its work to the owning module and anchors the entity there to its level; practice is a session, study a Knowledge study session on the skill's compound set, a project a Projects project, an assessment a task of a Skills type linked to Knowledge, and a review the review engine; Skills orchestrates like Routines.
  uses: [sessions, knowledge, KN-11, projects, tasks, RV-4, SK-17]
  proof: [BR-SK-6]
  work: LIF-140
# SK-7 split: practice (Sessions) stays here; the dev-log's reflection through Health's adaptation engine is SK-16.
- id: SK-7
  says: A practice action is a session of the practice sub_type with Skills' one-to-one extension, the base session owning time and lifecycle, and practice time derives from the sessions.
  uses: [sessions, SS-1, SK-20]
  proof: [BR-SK-2]
  work: LIF-140
- id: SK-8
  says: The skill graph links skills by requires, unlocks and synergy edges, in a global canonical graph with shared foundational skills and the user's personal instance; it recommends a path and detects synergies between goals, and the global graph grows by model drafts, curated additions, the user and community imports.
  uses: [SK-27]
  proof: [BR-SK-6]
  work: LIF-140
- id: SK-9
  says: An unpracticed skill decays through the review engine's curve, and its maintenance due item and reminder are advisory, configurable per skill and never nagging.
  uses: [knowledge, RV-4, RV-8, notifications, SK-19]
  work: LIF-140
# SK-10 split: the Purposes target stays here; the Gamification feeder is SK-22. Purposes reads mastery live (the
# run-22 model); nothing is pushed or copied to it.
- id: SK-10
  says: Target mastery is a Purposes target, the pursuable that carries the measurement kind and binding mode; Purposes reads a skill's mastery live through Skills and keeps no copy.
  uses: [purposes, PG-37, measurement, MS-9, SK-21]
  work: LIF-140
- id: SK-11
  says: Evidence (a project, a recording, a certificate) proves mastery through pages, attachments and project activities, and a dev-log's key insights become Knowledge objects, created through Knowledge's service, in the user's principles store.
  uses: [notes, projects, knowledge, SK-16]
  work: LIF-140
# SK-12: the opt-in clause folds into SK-3 and SK-14, and the advisory clause into SK-9.
- id: SK-12
  says: Skills' names and free text (a skill's name, description and why it matters, a level's criteria, indicators, challenges and key skills, an activity's instructions, prerequisites and success criteria, a dev-log's reflections and insights, a definition's name, templates and provenance, the measurement config) are encrypted client-side; enums, dates, ratings and counters stay plaintext.
  uses: [encryption]
  work: LIF-67
- id: SK-13
  says: Skills composes Sessions, Knowledge, Projects, Purposes, Spaces and Health's adaptation engine and adds only the capability spine, the Composer and the graph, never parallel machinery.
  uses: [sessions, knowledge, projects, purposes, spaces, health]
  proof: [BR-SK-2, BR-SK-5]
  work: LIF-140
# SK-14: on the localhost product there's no server, so the device makes every fetch; the import is the
# Integrations feature (LIF-426).
- id: SK-14
  says: The skill library import is a device-mediated public-reference whole-set fetch under the external-in grant, add-only, revocable and normalized per source, and the server never proxies it; a model draft is a scoped generate on the device or in the cloud as egress, never an agent, imported content carries its provenance into any prompt, and generated rows carry the ai source.
  uses: [integrations, ai, SK-27]
  work: LIF-560

# Proposed (unnumbered items and the method's items; Victor approves in the PR)
# SK-15: the schema is the whole rule (_registry.ts), so it has proof and no work (the HC-30 precedent, LIF-550
# item 2). skill_action is excluded: its rows tag the base session.
- id: SK-15
  says: Skills' entity types (skill, level, activity, dev-log, dependency, definition) register in the open taggable-type registry, so tags, notes and links reach them, and entity links replace the retired course-and-book resource junction; Skills owns no tag table.
  uses: [spaces, notes]
  proof: [BR-SK-5]
- id: SK-16
  says: A dev-log is the reflection on a practice session (how it felt, what worked, what to improve, the next plan, key insights) through the adaptation engine Skills shares with Health, so a skill can run experiments on the user's own learning; it reads the session's date and length instead of storing them.
  uses: [sessions, health, HC-7, HC-8, SK-7, SK-11]
  work: LIF-558
# SK-17 (Victor, 2026-11-11): the HC-36 model. skill_actions fits (it extends sessions) but stores scheduled_at and
# completed again, which BR-SK-2 leaves to the spine. skill_dev_logs is standalone with its own date and duration.
- id: SK-17
  says: Skills builds on other modules' entities instead of copying them; practice is a session of the practice sub_type, an assessment is a task of a Skills type, a study activity is a Knowledge study session and a project activity a Projects project, each anchored to its skill and level and tracked Skills' way with what the base lacks, and habits, routines and the other modules attach and link to Skills entities.
  uses: [sessions, SS-1, SS-5, tasks, TK-21, knowledge, projects, habits, routines, RT-3, spaces, RT-31, SK-6]
  open: Task, session and habit types don't exist as user or module types yet; the Spaces run settles them first (RT-31), then this row is revisited.
  work: LIF-558
# SK-18 (Victor, 2026-11-11): the ED-37 model, over every component, not only practice.
- id: SK-18
  says: The user prepares inside Skills following its hierarchy; preparation (the practice cadence, reminders, and sessions scheduled automatically before a level's target or the target mastery date) is set on a skill and passed down to its levels, activities and the sessions, tasks, projects and reviews they create, and any entity below can override it; Sessions generates the sessions as planned blocks next to the other modules' entities.
  uses: [sessions, SS-2, SS-7, notifications, knowledge, KN-11, projects, tasks, SK-6, SK-17]
  open: Which settings a preparation carries (cadence, timeframe, session count and length, reminder lead), how the skill's practice frequency and an activity's frequency map onto it, and how auto-scheduling meets the engine's placement pass (LIF-442).
  work: LIF-559
- id: SK-19
  says: Skills runs no due lane of its own; its due items ride their base entities, so practice is due as a planned session, an assessment as a task and decay maintenance as a review on Knowledge's lane, and they reach Today, the Calendar and reminders like any session, task or review.
  uses: [sessions, SS-7, tasks, TK-18, knowledge, KN-19, notifications, preferences, SK-9, SK-17]
  open: Whether a reminder for a Skills-typed session or task is gated by the study push toggle (the skill entity maps to it today) or by the base module's (LIF-479).
  work: LIF-558
- id: SK-20
  says: Skills ships the practice sub_type fully configured and registers it with Sessions; every practice is a session the user can name and type, attached to its activity, so the agenda and a routine step drive it.
  uses: [sessions, SS-1, SS-4, routines, RT-3, SK-7]
  work: LIF-140
- id: SK-21
  says: Skills exposes its skills, levels and activities and their events (a level reached, a practice done or missed, a skill at risk of decay) and measures (level, progress, mastery, practice consistency) as measurement sources and rule subjects that Purposes and Gamification read live; nothing copies Skills' data.
  uses: [measurement, MS-9, purposes, gamification, GM-36]
  work: LIF-140
# SK-22: split from SK-10. The feeder carries no payload (the LIF-511 decision).
- id: SK-22
  says: A level-up, a mastery reached and a practice streak emit the grant-currency feeder that Gamification applies; Skills emits the signal and never writes points.
  uses: [gamification, effects, GM-21, SK-21]
  work: LIF-140
- id: SK-23
  says: Skills contributes its day to the journal (practice done, levels reached, skills at risk), read live through its contribution.
  uses: [journals, JR-11]
  work: LIF-112
- id: SK-24
  says: Skills has its own journal blocks and capability blocks, the life skill tree over the graph among them; each reads Skills live and writes only through Skills' service, separate from its journal contribution.
  uses: [journals, JR-12, JR-20, capabilities, spaces, SK-8]
  work: LIF-200
- id: SK-25
  says: Skills serves a read provider for its entity types, so links, views, the graph and search resolve a skill, level, activity, dev-log or definition through Skills.
  uses: [views, spaces]
  work: LIF-140
- id: SK-26
  says: When the root composes Skills, Skills registers its practice sub_type and task types, its measurement sources, its journal contribution and its read provider; nothing is wired centrally.
  uses: [sessions, tasks, measurement, journals, views, SK-20, SK-21, SK-23, SK-25]
  work: LIF-140
- id: SK-27
  says: The global skill library and its graph, the locale variants of its definitions, ladder templates, activity templates and curated resources ship as opt-in default datasets the user accepts or declines, refreshed as a whole set and read from a local copy; the pattern is built even when declined.
  uses: [integrations, SK-2, SK-3, SK-8, SK-14]
  work: LIF-560
- id: SK-28
  says: The data model's record shows the Skills tables migration 021 built (seven tables, no foreign keys, the practice extension excluded from the entity types and without deleted_at, the resource junction retired, the older stored mastery default resolved out).
  proof: [BR-SK-1, BR-SK-3, BR-SK-5]
  work: LIF-63
- id: SK-29
  says: Skills' surfaces show every capability's terminal states (a skill planning, active, maintaining or completed, a Composer setup quick, advanced or incomplete, a fill by hand, drafting, failed or importing, a level upcoming, active or complete, a practice planned, in progress, complete or skipped, mastery with too little data, derived or overridden, a graph with no edges, a recommended path or a synergy, a decay flag none, at risk or dismissed).
  uses: [views]
  work: LIF-200

# Consumers with no row here. Built and in their own ledgers: Knowledge's entity links to skills and the skills
# compound set (KN-6, KN-11; buildCompoundSet('skills') is tested), Books leaving skill links to Skills (BK-16, BK-29),
# the one-sub_type rule (SS-1; practice is in the shipped vocabulary but not the shipped registry, SK-20), the
# taggable-type registry (SK-15). Built with no ledger row: Notifications maps the skill entity to the study push
# toggle (PUSH_TOGGLE_BY_ENTITY; SK-19, LIF-479). In their own ledgers, not built: Health's physical role and cooking
# links (HC-9, HN-14; skill_id and cooking_skill_id are schema only), the adaptation engine (HC-7, HC-8; SK-16),
# Purposes' live reads (PG-37 lists no Skills dep yet; SK-10), the measurement sources (MS-9; SK-21), the any-entity
# rule (GM-36; SK-21), the journal blocks (JR-12, JR-20; SK-24), Knowledge's review lane (KN-19; SK-9, SK-19),
# Routines' step reference (RT-3; SK-20). Designed only: Projects' project-type activities (SK-6), Gamification's
# Skills feeder (SK-22), Notifications' decay nudges (SK-9), Sessions' future Skills provider (SK-18), the Spaces life
# skill tree block (SK-24), external skill library import and template export (SK-14, the Integrations feature).
# Every Skills entity is a potential Gamification rule subject (GM-36, SK-21); no module is ruled out.
