# Calendar intent ledger: every intended, deferred or TBD rule of the Global Calendar, an OS feature with its own page
# (Victor 2026-11-05, LIF-426), prefix CL (Victor 2026-11-07). work = the issue that builds the rest. check:rules
# derives each row's state.
# The model (Victor, 2026-11-11, before the rows were written): the Calendar is the book of the user's life read by
# date, a read-only lens over every module's dated items in six ranges (Year, Month, Week, Day, Agenda, Living). It
# renders and never writes; a check, a move, slotting open time or reserving a slot runs the owning module's
# capability, composed in, and the Calendar owns no table. Sessions' Planner writes placed blocks, the Calendar reads
# them (the July Sessions intake, resolved 07-10). Events stay each module's own, and the same event held by two
# modules is connected by a link. The Calendar keeps its own page and lens; the calendar layout of saved views
# (VW-3) is a separate thing that Spaces and modules use, so ADR-007 §3.5 is amended (LIF-400).
# Sources: the Calendar code and tests, the Global Calendar lines in features/sessions-and-scheduling (identity
# 46-47, contract 25/36/60/64), IA §5, ADR-007, LIF-203, 439, 454 and 147, the archived fe-calendar task (read with
# Victor's OK at this run: the vision, envision, interpretation, slice-map, seam contract and the S2…S7 plans) and
# the Calendar lines of the July intakes.
# Built (the code is the truth): fe-calendar S1…S7 (LIF-203, a1148f93…cc0e350a), all six ranges live on real data in
# apps/web/src/app/calendar over the @vida/ui AgendaView, WeekView, YearView, LivingView and the shared month grid;
# the composition root builds sessions, habits, tasks, purposes, relationships and notes and registers three due
# lanes (tasks, purposes, relationships). Nothing changed since S7 but comments and formatting.
# Proof: the archived task states 74 BR-CAL-Sn-n rules, but check:rules reads no archive, and apps/web is outside
# "src", so only three are known: BR-CAL-S5-15 (a comment in @vida/ui), BR-CAL-S6-7 (a comment plus an it() title in
# calendar-derive.test.ts) and BR-CAL-S7-6 (a describe() title in calendar-readonly.test.ts). Every other built row
# cites its BR-CAL rules in the comment above it and keeps a work link to the issue that names the tests with their
# CL IDs. No test names a CL ID, and CL matches nowhere in Vida, inside another ID included. No test was renamed.
# Calendar has no features folder (LIF-426), so the archive guard applies from the start.

# Proposed IDs, every row: the Calendar has no features folder and no intent ID today (approve in the PR)

# The feature and its invariant.
- id: CL-1
  says: The Global Calendar is a Vida feature of its own with its own page, owned by no module; it is the book of the user's life read by date, showing every module's dated items in six ranges (Year, Month, Week, Day, Agenda, Living), and it owns no table and stores no copy.
  uses: [sessions, views]
  work: LIF-467
# BR-CAL-S7-6 (tested); BR-CAL-S2-6, S2-11, S3-14, S5-14; EC-12.
- id: CL-2
  says: Every range renders and never writes; a check, a move or slotting open time is an intent the owning module's capability carries out, and with no capability composed the control is absent, never a dead one.
  proof: [BR-CAL-S7-6]
# Books B9 and the July Sessions intake G7; Victor 2026-11-11 (reserving a slot runs the owning capability).
- id: CL-3
  says: From the Calendar the user ticks a habit, slots open time, reserves a slot for an activity and moves a placed block, each through the owning module's capability composed into the Calendar (Habits, Sessions availability and planned blocks, Routines slot presets); the Calendar owns no slot or reservation record.
  uses: [habits, sessions, SS-9, SS-14, routines, books, BK-12]
  work: LIF-573

# The ranges. BR-CAL-S7-8 and S7-9 (motion and the unfurl), the S1 chrome fix, EC-1, EC-11, EC-13, EC-14.
- id: CL-4
  says: A range switcher (a toolbar of the six ranges that condenses to a menu below tablet width) with previous, today and next sits in the page frame, which owns the period title once; the range swap fades and Today pulses the today mark, both instant under reduced motion; the active range and focused date are page state, never stored.
  work: LIF-572
# BR-CAL-S7-9, G13, G14; the vision's dense-day option 1; EC-2, EC-F3.
- id: CL-5
  says: Month reuses the shared month grid without its own header, shows the period's due items as chips with today marked and named, and a dense day unfurls in place, one day at a time, collapsing on Escape, a second press or a month change.
  uses: [views, VW-3]
  work: LIF-572
# BR-CAL-S2-1…S2-12, D1 and the S2 daypart bands, G8, G9; EC-3.
- id: CL-6
  says: Agenda lists the focused week's days in provider order, grouping only today by daypart (morning before noon, afternoon to 18:00, evening after, an untimed item in the morning); an item shows its time or All day, Must for an obligation task and no weight otherwise, a struck title when done, and habits by their time of day.
  uses: [tasks, habits]
  work: LIF-572
# BR-CAL-S3-1…S3-15, D-S3-DEV-1, G6, R3; EC-4. The live timed half waits on planned blocks (CL-17).
