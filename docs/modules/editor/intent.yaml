  says: When sync activates, the editor binds each page's Yjs document, which becomes the source of truth with the stored document a derived snapshot; until then the content source stays swappable without a rewrite.
  uses: [sync, notes, NP-4]
  work: LIF-98
- id: EDT-26
  says: The mobile app runs the editor inside a web view and makes the printable export with the platform's print engine.
  uses: [sync, SV-29]
  work: LIF-153

