  work: LIF-600

# Proposed: the quote embed (BK-7's editor half; the Books intake B11).
- id: EDT-24
  says: Any page embeds a stored quote as a block that references the quote, never a copy, renders it live, offers only quotes Books allows (the per-book toggle over the global one) and shows an honest state for a deleted or blocked quote.
  uses: [books, BK-7, preferences]
  work: LIF-610

# Proposed: venues and sync (BR-2; ADR-001 §101; ADR-003).
