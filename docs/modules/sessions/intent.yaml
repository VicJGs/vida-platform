# Sessions intent ledger: every intended, deferred or TBD Sessions rule, keyed by its
# docs/features/sessions-and-scheduling ID (SS) or its docs/features/pomodoro ID (PD; Pomodoro is
# the focus sub-type's runtime, a feature inside Sessions). proof = the built rules in
# docs/features/sessions-and-scheduling/current-business-rules.md; work = the issue that builds the rest.
# check:rules derives each row's state. The sessions-rescope X1–X7 harvest run (LIF-349 run 11)
# linked the rows it left open to LIF-447…LIF-453. The effect rail (docs/core/effects, ADR-004 §3.2.5)
# writes its rows here as EF (the substrate pattern; LIF-349 run 37), at the end of the file.

# Invariants: the Session framework (docs/features/sessions-and-scheduling/business-rules.md)
- id: SS-1
  says: A session is exactly one sub_type over one shared spine; pomodoro is the focus runtime, never a sub_type, and each owning module registers its own sub_type.
  uses: [books, tasks, learning, knowledge, health, languages]
  proof: [BR-1]
- id: SS-2
  says: sub_type (the tool family and owner) and purpose (why) are separate axes and separate enums, never one conflated enum.
  proof: [BR-2]
- id: SS-3
  says: No session type, shipped or user-made, exists without all four Integration Contract dimensions declared (attachment, effects, lifecycle, permissions).
  proof: [BR-3]
- id: SS-4
  says: Every identified sub_type ships fully configured by us; the user never sets up the main ones, and user extensibility is for new long-tail types only.
- id: SS-5
  says: A user-created type may attach to any entity and declare effects only inside its permission envelope, and sensitive-module effects (Finance, Health) need explicit opt-in consent.
  uses: [finance, health]
  proof: [BR-4, BR-6, BR-12]
- id: SS-6
  says: A session never affects an entity it is not attached to, two types never count the same event twice (deterministic effect_event_id over the applied_effects ledger), and a permission violation is a hard, logged rejection.
  uses: [effects]
  proof: [BR-4, BR-9]
  work: LIF-447
# Invariants: the Scheduling engine
- id: SS-7
  says: The engine owns planned_blocks and its own generated sessions but never stores a copy of another module's due work; the agenda is its own blocks plus live dueIn provider reads.
  uses: [books, knowledge, learning, languages, journals]
  proof: [BR-34, BR-37]
- id: SS-8
  says: A planned_block is the plan and never the log; completing it calls the owner's createSession(), which carries planned_block_id.
  proof: [BR-36]
  work: LIF-442
- id: SS-9
  says: Availability windows and exceptions are Planner-owned scheduling input; Routines may preset recurring windows, and attended sessions consume availability while planned ones fill it.
  uses: [routines]
  proof: [BR-26, BR-27, BR-28]
  work: LIF-442
- id: SS-10
  says: On completion the engine emits a signal (duration, resource, outcome); Knowledge owns mastery and Education owns pace, and Sessions never computes a domain measure.
  uses: [knowledge, learning]
  work: LIF-443
# Invariants: runtime and analytics
- id: SS-11
  says: Pomodoro is the focus sub_type's runtime, owned in the Sessions realm and keyed by session_id; the Notes /pomodoro block is a lens onto focus sessions, never the owner.
  uses: [notes]
  proof: [BR-21, BR-24]
- id: SS-12
  says: Session analytics (completion rate, average focus, planned-vs-actual, time per module, streaks) are derived on read from the session log, never stored in synced aggregate tables.
  proof: [BR-35]
  work: LIF-443
# Proposed IDs, no ID in docs/features today (approve in the PR)
- id: SS-13
  says: A dueIn provider lane that fails degrades only that lane with a typed ProviderUnavailable(module), the other lanes render, and the engine never writes another module's schedule to recover.
  uses: [journals]
  proof: [BR-34]
  work: LIF-449
- id: SS-14
  says: generatePlan(scope, window) plans across every module, not one course, and a batch travels draft, pending_approval, approved, active, then completed or failed; no availability or nothing to schedule fails explicitly (NoAvailability, NothingToSchedule), never as an empty batch.
  proof: [BR-32]
  work: LIF-442
  open: The placement algorithm (urgency scoring, recalculation on a miss), a G5 design pass.
- id: SS-15
  says: A planned block whose target due work vanished before it ran resolves to empty and is dropped or flagged, never left as a dangling row.
  work: LIF-442
- id: SS-16
  says: A session with ended_at before started_at, or a duration beyond its block window, is a typed validation error and is never stored.
  proof: [BR-13]
  work: LIF-442
- id: SS-17
  says: Editing a shipped type is allowed behind a not-recommended warning, scoped to the user's device and never pushed as a default.
  work: LIF-198
- id: SS-18
  says: Sessions has its own view family (Hub, wizard, Management, Availability, per-type tools) and an empty state that offers a starter availability grid and the shipped types.
  work: LIF-198
- id: SS-19
  says: An effect whose attached entity was deleted no-ops loudly with a typed AttachmentTargetMissing; it never resurrects the entity or fails the whole completion.
  work: LIF-447
# Proposed IDs from sessions-rescope X1–X3 and the study decision (LIF-349 run 11; approve in the PR)
- id: SS-20
  says: Every completion goes through one door, transition(), which checks that every declared non-projection effect has a handler before any write (NoEffectHandler), treats a soft-deleted session as missing, and counts as fired only the effects the ledger applied.
  uses: [effects]
  proof: [BR-10, BR-20]
  work: LIF-447
- id: SS-21
  says: Whether a completed session's effects were applied is derived on read from the applied_effects ledger, never stored as a flag, and a replay re-applies only the effects with no ledger row.
  uses: [effects]
  proof: [BR-9]
  work: LIF-449
- id: SS-22
  says: Sessions ships the study sub_type, fully configured in all four dimensions, as the scheduling engine's own generated sessions; focus and study are the shipped roster.
  proof: [BR-15]
  work: LIF-442

# Invariants: Pomodoro, placement and ownership (docs/features/pomodoro/business-rules.md)
- id: PD-1
  says: A pomodoro is always the runtime of a focus session and attaches to a session_id, never to a task, note or class; starting a timer is starting or resuming a focus session.
  proof: [BR-14, BR-15]
- id: PD-2
  says: The /pomodoro widget is a view, never an owner; in a page it lists the focus sessions, launches one and links the page's analytics to that session.
  uses: [notes]
  work: LIF-198
- id: PD-3
  says: Interval durations are Preferences-owned and the runtime only obeys them; named focus templates are focus-session presets owned by Sessions, with at most one default.
  uses: [preferences]
  proof: [BR-24, BR-29, BR-30]
  work: LIF-433
# Invariants: Pomodoro runtime behaviour
- id: PD-4
  says: Interval type (focus, short_break, long_break) and status (running, paused, completed, cancelled) are fixed enums mirrored by a database constraint, and a long break follows every sessions_before_long focus intervals.
  proof: [BR-21, BR-24]
- id: PD-5
  says: Paused time is excluded from focus; real focus is elapsed minus total paused time.
  proof: [BR-22]
- id: PD-6
  says: Cancelling mid-focus records was_interrupted and an optional reason, which feed focus analytics.
  proof: [BR-23]
- id: PD-7
  says: Auto-start of breaks and of the next interval, notifications and sounds govern interval boundaries, each with a sane default and user-overridable.
  uses: [preferences, notifications]
  work: LIF-444
- id: PD-8
  says: A break carries per-session-type guidance in Focus Mode (hydrate, recompose, rest, a suggested activity), not a bare countdown.
  work: LIF-445
# Invariants: Pomodoro effects and analytics (ride the Session Integration Contract)
- id: PD-9
  says: Time to a task flows only through the focus session's log_time effect into task_time_logs; Pomodoro never writes actual_minutes.
  uses: [tasks]
  work: LIF-448
- id: PD-10
  says: A completed focus session fires its declared award_xp effect (granted as grant_currency into the consequence_ledger) and surface_journal (the daily focus feed), with no bespoke Pomodoro wiring to Gamification or Journals.
  uses: [gamification, journals]
  work: LIF-401
- id: PD-11
  says: Focus analytics (completed count, focus time, planned-vs-actual, focus streaks) are a derived cut of the session log, never a synced Pomodoro aggregate.
  proof: [BR-35]
  work: LIF-443
- id: PD-12
  says: A pomodoro's effects are scoped to its session's attachments, never count one event twice, need opt-in consent for sensitive modules, and a failed effect is typed and logged while the completion still records.
  uses: [effects]
  proof: [BR-9]
  work: LIF-447
# Proposed IDs, no ID in docs/features today (approve in the PR)
- id: PD-13
  says: Focus Mode is the runtime's low-distraction face; it composes the session type's declared tools per sub_type and per platform (mobile, desktop, web), and is never hard-wired to one module.
  uses: [health, books, tasks]
  work: LIF-445
  open: The Focus Mode design pass, covering the per-type tools, the per-platform states, and enforced or skippable breaks.
- id: PD-14
  says: A config change during a run applies to the next interval and never edits the running one.
  uses: [preferences]
- id: PD-15
  says: Starting focus without a session_id first creates a focus session carrying the caller's attachment, and a failed creation is a typed NoFocusSession, never a timer with no session.
  work: LIF-448
- id: PD-16
  says: Only interval boundaries persist (start, pause, complete, accumulated pause and interruption); the per-second countdown is client state, never written per tick.
  work: LIF-451
# Proposed IDs from sessions-rescope X2 (LIF-349 run 11; approve in the PR)
- id: PD-17
  says: A completed focus session declares surface_journal, a projection with no handler that feeds the daily focus feed; this is the Sessions half of PD-10, whose award_xp half is Gamification's.
  uses: [journals]
  work: LIF-448
- id: PD-18
  says: Completing focus closes its session through the one firing path, and cancelling it closes the session as skipped with no effects; a focus run's state changes only through startFocus, pauseFocus, completeFocus and cancelFocus.
  proof: [BR-21, BR-23]
  work: LIF-448

# The effect rail (docs/core/effects; ADR-004 §3.2.5 owns the contract, INT-2). EF rows (LIF-349 run 37, prefix
# on LIF-426). EF-1…EF-9 mirror docs/core/effects BR-1…BR-8 and its handler tx contract. They cite no proof:
# the rail's tests name bare BR-n, which collide with the Sessions rules' own BR-n inside intentTests.sessions,
# and foundation/effects is outside that path (run 10). LIF-613 names the tests with their EF IDs and adds the path.
# EF-1: BR-1, applied_effects composite primary key with the in-transaction check-and-insert (ADR-004 §3.2.5-B2).
- id: EF-1
  says: An effect applies at most once per effect_event_id, effect type and target; a second identical event applies nothing, fires no handler and returns applied false.
  work: LIF-613
# EF-2: BR-2 (ADR-004 §3.2.5-B1). The id is the canonical string today; the derive() hash is a build-phase,
# representation-only compaction (ADR-011 §3.8), and ADR-004 picks none. Its pick before sync is EF-19.
- id: EF-2
  says: The effect_event_id is derived from the event's stable identity (subject natural key, transition, effect type), so the same outcome gets the same id on any device and on every retry; it is never random.
  work: LIF-613
# EF-3: BR-3 (ADR-004 §3.2.5-A2, A4; framework R2). Fails closed: NoEffectHandler before any write.
- id: EF-3
  says: Every non-projection effect is applied only through the handler registered for its type; an effect with no handler fails closed with NoEffectHandler and writes nothing, never a silent drop or a direct table write.
  work: LIF-613
# EF-4: BR-4 (ADR-004 §3.2.5-A2).
- id: EF-4
  says: The registry binds each effect type to exactly one handler, and registering a second one throws DuplicateEffectHandler instead of overriding it.
  work: LIF-613
# EF-5: BR-5 (ADR-004 §3.2.5 taxonomy; ADR-012 adds grant_currency, lock_currency, move_money and
# surface_notification as additive). contribute_purpose_metric is retired by Victor's 2026-11-09 decision
# (LIF-521, PG-37): it is still in the enum, the CHECK and the class map on main, and ADR-004 is amended here.
- id: EF-5
  says: Every effect type in the catalogue has exactly one class (keyed, additive, projection or intra-realm), enforced at compile time, and the catalogue is ADR-004's base types plus ADR-012's four economy and notification types. contribute_purpose_metric is retired, because no module pushes progress into Purposes, which reads each related entity through that entity's service and computes the day's progress (PG-37); the type leaves the enum, the database check and the class map, and its emits go from Tasks, Habits and Routines.
  work: LIF-521
# EF-6: BR-6 (ADR-004 §3.2.5 taxonomy, projection).
- id: EF-6
  says: A projection effect (surface_journal, surface_calendar) writes no ledger row and invokes no handler, because Journal and Calendar aggregate at render; it never carries a persisted side effect, and a write-shaped consequence is surface_notification.
  uses: [journals, calendar]
  work: LIF-613
# EF-7: BR-7 (ADR-004 §3.2.5-B4; ADR-002 §5.20).
- id: EF-7
  says: The applied_effects ledger is device-local; it carries no sync columns and never enters the sync queue, so it guards replay on one device and cross-device convergence rides the output rows (EF-12).
  uses: [sync]
  work: LIF-613
# EF-8: the handler tx contract. The tx-scoped write path it once owed to DB-6 is built: the Repository's
# createInTx (b52d7b46) encrypts and enqueues inside the caller's transaction, and every built handler uses it.
- id: EF-8
  says: A handler receives the rail's active transaction and co-writes through it, never opening its own; a handler throw rolls back both its write and the ledger row.
  work: LIF-613
# EF-9: BR-8 (ADR-004 §3.2.5-A3, §3.2.4; XCU-22). Built as a pure seam; no handler calls it yet (EF-11).
- id: EF-9
  says: The fire-time consent gate rejects a non-projection effect aimed at a sensitive module (Finance, Health) that the caller's consented set lacks, with EffectConsentMissing and no write; the caller supplies the consented set and the module class, never inferred, and producers never call it.
  uses: [finance, health]
  work: LIF-613
# Proposed IDs (LIF-349 run 37; approve in the PR)
# EF-10: ADR-004 §3.2.5-A1, A3. Built in the economy and move_money handlers (a parse, then a typed error).
# The Tasks log_time handler returns silently on a payload-less event after the rail wrote its ledger row
# (LIF-448 makes it throw); the Notifications handler skips a bad payload (LIF-536).
- id: EF-10
  says: A module's registered effect handlers are its documented write interface for effects; each validates the caller's scope, the consent envelope and the payload before any write, and a failure is a typed rejection with no partial write, never a silent skip.
  uses: [finance, gamification, notifications, tasks]
  work: LIF-448
# EF-11: ADR-004 §3.2.4 (amended this run) and §3.2.5-A3, with BR-8's Deferred list (the gate's invocation,
# consent-threading). The two modes: Victor 2026-11-13. On main nothing calls assertEffectPermitted, and
# EffectEvent carries no consent.
- id: EF-11
  says: A sensitive effect (Finance, Health) has a consent mode, override applying it under the user's standing consent and ask prompting the user every time its conditions are met; an asked effect writes nothing and has no ledger row until the user says yes, then applies through replay, and a no records it as declined, never applied. The Finance and Health handlers call the consent gate before any write, with the producer's consent carried to them.
  uses: [finance, health, spaces]
  work: LIF-614
  open: Where the consent and its mode ride (an event field or the dispatch context), where an asked effect waits and a decline is recorded, and which surface asks.
# EF-12: ADR-004 §3.2.5-B1, B3 and its owed schema (ADR-002 §5.20). Built on consequence_ledger and
# notifications; missing on transactions (move_money) and task_time_logs (log_time), flag LIF-615.
- id: EF-12
  says: Every write effect's output row carries its effect_event_id under a unique constraint (a keyed effect also keeps its domain key), so two devices applying the same event converge to one row.
  uses: [gamification, notifications, finance, tasks, habits, purposes]
  work: LIF-615
# EF-13: ADR-004 §3.2.5-B3. ADR-003's conflict handling owns the merge; the critique gate's F10 tracks it for build.
- id: EF-13
  says: When two devices' output rows collide on the same effect_event_id at sync, the sync layer merges them into one outcome instead of failing; the rail supplies the key, never the merge.
  uses: [sync]
  work: LIF-98
# EF-14: the F1/D1 guarded-write spec's BR-5 (ratified 2026-07-16), now ADR-004 §3.2.5-B5 with the server
# product's cases (Victor 2026-11-13; SV-17, SV-32, SV-33, ADR-014 §3.1a). The hand-off is EF-20.
- id: EF-14
  says: Effects are applied by the device that originates the lifecycle event, and a device that receives a synced output row never fires its effects again; for the server's background work the device that opens the sealed result and writes the rows is the origin, and the server never applies, opens or merges an effect.
  uses: [sync, integrations]
  work: LIF-98
# EF-15: ADR-004 §3.2.5-C (D1-c, INT-2). Enforcement differs by trust tier: user code has no ambient database
# access (CB-10), shipped code is held by structure, review and the CI guard (LIF-362, moved to Sessions).
- id: EF-15
  says: The write contract binds every effect producer alike (session effects, shipped capabilities, user capabilities, agents); shipped code is held to it by a build-time guard that fails when a module writes another module's tables directly.
  uses: [spaces, ai]
  work: LIF-362
# EF-16: SB-Q2 (Victor, 2026-11-07): each module registers its own handlers when composed (HC-32, GM-21,
# ED-32, GR-13). On main the root builds the rail over an empty registry and registers no handler.
- id: EF-16
  says: The composition root builds one effect rail and one registry shared by every producer, and each effect-receiving module registers its own handlers into it when the root composes it.
  work: LIF-450
# EF-17: ADR-004 §3.2.5 taxonomy, intra-realm. The attach_pomodoro handler is LIF-448's.
- id: EF-17
  says: The intra-realm attach_pomodoro effect rides the same handler path as every other write effect, with no direct-write exemption for being owned by Sessions, and its id derives from the session and its run.
  uses: [tasks]
  work: LIF-448
# EF-18: ADR-004 §3.2.5-B2, B4 and the effect-rail build (#32, IR-1). Built: applyEffect opens one
# transaction per effect, and the lifecycle fire loop and the economy's dispatchConsequence run with no outer one.
- id: EF-18
  says: A fan-out of several effects is replay-safe, not all-or-none; each effect owns its transaction and ledger row, and a failure part-way is recovered by replaying the event, never by rolling back the effects already applied.
  work: LIF-613
# EF-19: the derive() hash (ADR-011 §3.8, build-phase; ADR-004 §3.2.5 "does not yet pick"). Victor 2026-11-13: an
# architecture question that drifts if mishandled, so it is one decision (LIF-617, blocking LIF-615 and LIF-98), and
# foundation/effects/event-id.ts is in checks.oneWayDoor.
- id: EF-19
  says: The effect_event_id's final form is one architecture decision, recorded in ADR-004 §3.2.5 before any output row stores it under a unique constraint or sync activates; the derivation is a one-way door, and it changes only the representation, never which events share an id.
  uses: [sync]
  work: LIF-617
  open: Which form (the canonical string kept, a fixed-length hash of it, a name-based identifier), and whether rows already stored are rewritten.
# EF-20: ADR-004 §3.2.5-B5 (Victor 2026-11-13): effects work on the user's other devices through their own server.
- id: EF-20
  says: An effect whose target is bound to another of the user's devices is sealed to the account's public key with its effect_event_id and relayed by the user's server, and the first device able to apply it does, once per that id; with no server it waits on the origin device and travels with sync, and a missing handler is never a hand-off.
  uses: [sync, integrations, encryption]
  work: LIF-618

# Consumers with no EF row (each in its own ledger): the handlers (GM-21 award_xp, ECO-6…8 grant and lock,
# FN-16 move_money, NF-16 and NF-22 surface_notification, HB-29 complete_habit_occurrence, MS-5 the signal),
# the emitters (TK-16, HB-16, RT-23, KN-15, PJ-23, BK-33, PG-28, SK-22, CK-24, RL-23, ED-28), the producers'
# guarded-write rows (CB-4, CB-10, AX-4, PG-7), and the Sessions engine's side (SS-6, SS-19, SS-20, SS-21, PD-12).
# ADR-004 §6 trigger (b): a catalogue that outgrows the fixed enum reopens the decision as a plugin registry.
