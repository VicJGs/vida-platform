- id: DSG-16
  says: Density (calm or dense) is one stylesheet toggled by an attribute, scaling the spacing band and the type together.
  work: LIF-592
- id: DSG-17
  says: Components read preset colours through the semantic tokens, and only signal colours, which don't change per preset, stay on the base component themes.
