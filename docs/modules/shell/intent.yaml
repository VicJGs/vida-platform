# The design system. token-pipeline current-spec and current-business-rules; packages/ui/src/themes.
# DSG-1…DSG-12 = B1…B12.
- id: DSG-1
  says: Every emitted value (a style variable, a theme token, a theme key) traces to exactly one seed entry, and no value is authored twice.
  work: LIF-592
- id: DSG-2
  says: Tokens are three layers that never skip one; primitives are literals, semantics reference primitives and components reference semantics, and a literal outside the primitives, a skipped layer, a dangling reference or an empty layer fails the build with its cause named.
  work: LIF-592
- id: DSG-3
  says: Names follow each target's own scheme; a seed path a/b/c is the style variable --a-b-c, and theme tokens follow the theme library's flat categories.
  work: LIF-592
- id: DSG-4
  says: The same seed always builds byte-identical outputs.
  work: LIF-592
- id: DSG-5
  says: Every output is generated and marked as never hand-edited; the seed is the only editable input.
  work: LIF-592
- id: DSG-6
  says: The scales are complete with no arbitrary values; brand and neutral ten-step ramps, success and danger signals, seven type sizes, the 4-point spacing set, radius from small to full and three shadows.
  work: LIF-592
- id: DSG-7
  says: Dark is designed in parallel, never inverted; every semantic that differs in dark has its own dark entry, mapping one to one to design-tool modes.
  work: LIF-592
- id: DSG-8
  says: Every spacing primitive sits on the 4-point grid, and an off-grid one fails the build.
  work: LIF-592
- id: DSG-9
  says: Typography and shadow tokens skip the theme tokens and go to the style variables plus a typed export each.
  work: LIF-592
- id: DSG-10
  says: Text on every surface meets the minimum text contrast in every preset and mode, checked in the build over the full matrix.
  work: LIF-592
- id: DSG-11
  says: Motion tokens are four durations within the standard's bands and three easing curves plus linear, routed to the style variables and a typed motion export.
  work: LIF-592
- id: DSG-12
  says: Every animation has a reduced-motion path that changes state instantly, and animates transform, opacity or clip-path only.
  work: LIF-592
