# Shell intent ledger: every intended, deferred or TBD rule of the Shell, a platform feature (Victor 2026-11-06,
# LIF-426) with its own ledger, plus the design system it renders with under its own prefix. work = the issue that
# builds the rest. check:rules derives each row's state.
# Prefixes (Victor, 2026-11-13): SH for the Shell's own rows and DSG for the design system (the token pipeline, the
# preset themes, density and fonts, Storybook and the Figma file), the substrate pattern of MS in Purposes. UX, DS and
# UI were out: UX-n, DS-n and UI-n match 956, 677 and 1,460 times in Vida (the archived unit names). SH and DSG had 0
# matches on 14072b28, inside other IDs included. DSG-1…DSG-12 are the token pipeline's B1…B12 and DSG-13…DSG-18 its
# B-codec and DS-4 rules, one to one; every other row is proposed.
# The model (Victor, 2026-11-13, before the rows were written): the code and the fe-shell model are the intent. The
# frame is two dock-or-float inspector panels (System, Modules) on any edge, content-fit, around a full-bleed content
# region under a reserved top strip, with an overlay host above (fe-shell #14, envision M1–M7, 2026-10-10). Bar 1 (the
# Spaces scope selector and the six global surfaces) lives in both the strip and the System panel (fe-shell-scope
# #15). shell-layout.md's five-region frame (a left dock as drawer, rail and sidebar, a global bar and a Spaces bar,
# UX-3) is superseded; the docs are rewritten under LIF-593.
# Sources: docs/ui (the README, five empty stubs, token-pipeline current-spec and current-business-rules), the shell
# layout (UX-3: shell-layout.md and its archived task), LIF-403 and LIF-404; read with Victor's OK at this run: the
# archived fe-shell #14 delivery files (envision, interpretation, slice map, seam contract, the S3…S5 plans), the
# archived fe-shell-scope #15 delivery files, the archived ui-4 task (index, baseline, S1…S5), the live
# information-architecture.md and command-bar-and-search.md.
# Built (the code is the truth): ux-3 (LIF-92, 85639c4d), ui-4 (LIF-89, 57aef4ff…2932edb7), fe-shell #14
# (df0cf8ac…8a4e5a58), fe-shell-scope #15 (LIF-219, 88f80a2a…f8f9a44e), the content inset fix (815bd200), the HUD slot
# (6ac01bd2) and preferences-rescope R4 and R5 (d3814827, a5edcba9) in apps/web/src/{shell,nav,command-bar}; the token
# pipeline DS-1…DS-4 and fe-codec-theme S1…S3 in packages/ui. Mounted in routes.tsx: the strip with Bar 1 and the HUD,
# the System panel body and the command bar. Not mounted: the module dock (the Modules panel shows a placeholder).
# Proof: the tests name archived codes (EC-n, S2-BR-x, BR-S3-n, R5-BR-n, B1…B12, B-codec-n), never a BR rule in the form
# check:rules reads nor a row ID, so every built row keeps a work link to LIF-592 (name the tests). No test was renamed.
# Shell has no features folder (LIF-426), so the archive guard applies from the start.
# Consumers (each in its owner's ledger): NP-27 (Trash in the System panel), PR-7, PR-18 and PR-20 (the flag, the dock's
# preference reads, the page transition), SPC-12 (the scope list), GM-1 (the conditional entry), the Session HUD in the
# strip's slot (Sessions, fe-session-hud, no row), Home at / (Journals), the Calendar page (CL-1) and the inbox (NF-21).

