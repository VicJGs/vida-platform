name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:one-way-door diffs against origin/main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Docs reshape 0.2: one row per tracked .md, uploaded for the per-folder decisions.
      - run: pnpm docs:inventory

      - uses: actions/upload-artifact@v4
        with:
          name: doc-inventory
          path: inventory.csv

      # The pre-push hook's tiers (tools/checks/core/changed.mjs): docs → check:fast; checks
      # (docs + the gate's own files) → check:checks; affected (+ workspace packages) →
      # check:affected, the package tasks of the changed packages and their dependents only;
      # anything else → the full gate. A push to main always runs the full gate (the
      # post-merge safety net).
      - name: Tier
        id: tier
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "tier=code" >> "$GITHUB_OUTPUT"
            echo "Tier code: a push to main always runs the full gate"
          else
            tier=$(pnpm -s check:tier)
            echo "tier=$tier" >> "$GITHUB_OUTPUT"
            echo "Tier $tier"
          fi

      - if: steps.tier.outputs.tier == 'code' || steps.tier.outputs.tier == 'affected'
        run: pnpm --filter @vida/web exec playwright install --with-deps chromium

      # The same command as the pre-push hook: guardrail scan, format, toolkit checks, then lint typecheck test e2e.
      - if: steps.tier.outputs.tier != 'docs' && steps.tier.outputs.tier != 'checks' && steps.tier.outputs.tier != 'affected'
        run: pnpm check
        env:
          TURBO_TELEMETRY_DISABLED: 1

      # Affected tier: the toolkit checks, then lint typecheck test e2e for the changed
      # packages and their dependents (turbo --affected against origin/main).
      - if: steps.tier.outputs.tier == 'affected'
        run: pnpm check:affected
        env:
          TURBO_TELEMETRY_DISABLED: 1

      # Checks tier: every wired toolkit check, no package tasks.
      - if: steps.tier.outputs.tier == 'checks'
        run: pnpm check:checks

      # Docs tier: guardrail scan, format, one-way-door, rules, and no new check:docs findings.
      - if: steps.tier.outputs.tier == 'docs'
        run: pnpm check:fast
