name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**', '.claude/**']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**', '.claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:one-way-door diffs against origin/main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @vida/web exec playwright install --with-deps chromium

      # The same command as the pre-push hook: guardrail scan, format, toolkit checks, then lint typecheck test e2e.
      - run: pnpm check
        env:
          TURBO_TELEMETRY_DISABLED: 1
